title: "[Idea]: "
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should Agentsim explore?
    validations:
      required: true
  - type: textarea
    id: user-value
    attributes:
      label: User value
      description: How does this help a solo software freelancer deliver better work?
