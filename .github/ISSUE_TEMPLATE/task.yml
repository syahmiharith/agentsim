name: Maintainer task
description: Maintainer-only template for internal cleanup, chores, or scoped implementation work.
title: "task: "
labels: ["task", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This template is intended for maintainers. Contributors should usually use bug reports, feature requests, documentation improvements, or workflow improvements.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and excluded?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List concrete completion criteria.
    validations:
      required: true
