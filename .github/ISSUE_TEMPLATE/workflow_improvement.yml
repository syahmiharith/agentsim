name: Workflow improvement
description: Improve agent roles, review loops, approvals, or final package assembly.
title: "workflow: "
labels: ["workflow", "needs-triage"]
body:
  - type: dropdown
    id: workflow-step
    attributes:
      label: Workflow step
      options:
        - Client intake
        - Scope / PM
        - Architecture
        - Builder
        - Reviewer / QA
        - Delivery
        - Artifact lineage
        - Decisions / approvals
        - Event trace
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What does Agentsim do today?
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: What should change, and how will it improve handoff quality?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should maintainers know this is done?
      placeholder: |
        - Generated scope references assumptions.md
        - qa-report.md checks each must-have requirement
        - events.jsonl records the review outcome
    validations:
      required: true
