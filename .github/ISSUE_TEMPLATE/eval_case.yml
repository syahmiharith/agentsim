name: Eval case
description: Propose a test scenario for the software-freelance workflow.
title: "eval: "
labels: ["eval", "needs-triage"]
body:
  - type: input
    id: scenario
    attributes:
      label: Scenario name
      placeholder: Small CRM for a neighborhood cleaning company
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Client-style prompt
      description: Write the vague request a freelancer might receive.
      placeholder: I need a simple way to track leads, jobs, and follow-ups for my cleaning business.
    validations:
      required: true
  - type: textarea
    id: expected-artifacts
    attributes:
      label: Expected artifacts
      description: What should the final package contain or prove?
      placeholder: Requirements cover lead capture, job status, follow-up reminders, and admin notes. App runs locally with mock data.
    validations:
      required: true
  - type: textarea
    id: scoring
    attributes:
      label: Scoring notes
      description: Mention requirement completeness, scope realism, runnability, QA quality, handoff usefulness, or cost.
    validations:
      required: false
